# KMS-managed secrets for pricing service.
# Synced from kms.hanzo.ai → K8s secret "pricing-secrets" in namespace "hanzo".
#
# Required KMS project: "pricing" with environment "production"
# Required keys: PRICING_API_KEY, ZEN_MASTER_KEY, THIRD_PARTY_MARKUP
---
apiVersion: v1
kind: Secret
metadata:
  name: pricing-kms-auth
  namespace: hanzo
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/component: kms-auth
    app.kubernetes.io/part-of: hanzo-universe
type: Opaque
stringData:
  clientId: ""
  clientSecret: ""
---
apiVersion: secrets.lux.network/v1alpha1
kind: KMSSecret
metadata:
  name: pricing-kms-sync
  namespace: hanzo
  labels:
    app.kubernetes.io/name: pricing
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: hanzo-universe
spec:
  hostAPI: https://kms.hanzo.ai
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: pricing-kms-auth
        secretNamespace: hanzo
      secretsScope:
        projectSlug: pricing
        envSlug: production
        secretsPath: /
  managedSecretReference:
    secretName: pricing-secrets
    secretNamespace: hanzo
    secretType: Opaque
