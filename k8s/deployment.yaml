apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: hanzo
  labels:
    app: pricing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pricing
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pricing
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: pricing
          image: ghcr.io/hanzoai/pricing:latest
          ports:
            - containerPort: 8080
          env:
            - name: PRICING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pricing-secrets
                  key: PRICING_API_KEY
            - name: ZEN_GATEWAY_URL
              value: "http://zen-gateway.zen.svc.cluster.local:4100"
            - name: ZEN_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: pricing-secrets
                  key: ZEN_MASTER_KEY
            - name: THIRD_PARTY_MARKUP
              valueFrom:
                secretKeyRef:
                  name: pricing-secrets
                  key: THIRD_PARTY_MARKUP
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
