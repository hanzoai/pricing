apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pricing
  namespace: hanzo
  labels:
    app: pricing
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: hanzo
  tls:
    - hosts:
        - pricing.hanzo.ai
      secretName: pricing-tls
  rules:
    - host: pricing.hanzo.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pricing
                port:
                  number: 8080
