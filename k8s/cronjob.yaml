apiVersion: batch/v1
kind: CronJob
metadata:
  name: pricing-sync
  namespace: hanzo
  labels:
    app: pricing
spec:
  # Run daily at 04:00 UTC.
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: pricing-sync
              image: curlimages/curl:latest
              command:
                - sh
                - -c
                - |
                  curl -sf -X POST \
                    -H "Authorization: Bearer $(PRICING_API_KEY)" \
                    http://pricing.hanzo.svc.cluster.local:8080/v1/sync
              env:
                - name: PRICING_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: pricing-secrets
                      key: PRICING_API_KEY
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
          restartPolicy: OnFailure
