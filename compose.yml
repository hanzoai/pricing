services:
  pricing:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ZEN_GATEWAY_URL=http://zen-gateway.zen.svc.cluster.local:4100
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
