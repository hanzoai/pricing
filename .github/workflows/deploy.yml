name: Build and Deploy Pricing Service

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hanzoai/pricing

jobs:
  build-and-deploy:
    runs-on: hanzo-k8s
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Install buildah
        run: |
          apt-get update -qq && apt-get install -y -qq buildah fuse-overlayfs >/dev/null 2>&1 || true

      - name: Build container image
        run: |
          buildah build --format docker --layers -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u ${{ github.actor }} --password-stdin ${{ env.REGISTRY }}
          buildah push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          buildah push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save 1a153000-90a6-48ad-9375-7ef901a9bf7f

      - name: Deploy to K8s
        run: |
          kubectl apply -f k8s/
          kubectl -n hanzo rollout restart deployment/pricing
          kubectl -n hanzo rollout status deployment/pricing --timeout=120s
